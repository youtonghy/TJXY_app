name: Release Desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, for example 1.2.3 or v1.2.3
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ inputs.version }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22.22.3
  RUST_VERSION: 1.88.0

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Normalize version
        id: version
        env:
          RELEASE_INPUT: ${{ inputs.version }}
        shell: bash
        run: |
          version="${RELEASE_INPUT#v}"
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo 'Version must be semantic, for example 1.2.3 or v1.2.3.' >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Pin release source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  frontend:
    name: Build frontend
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          path: TJXY_app
      - uses: actions/checkout@v6
        with:
          repository: youtonghy/TJXY
          ref: main
          path: TJXY
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: TJXY/admin/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix TJXY/admin ci
      - name: Configure HeroUI Pro
        working-directory: TJXY/admin
        env:
          HEROUI_KEY: ${{ secrets.HEROUI_KEY }}
        run: |
          if [ -z "$HEROUI_KEY" ]; then
            echo 'Repository secret HEROUI_KEY is required for release builds.' >&2
            exit 1
          fi
          npx -y hpsetup@latest --auto
      - name: Typecheck and build frontend
        working-directory: TJXY
        run: |
          npm --prefix admin run typecheck
          VITE_TJXY_SHELL=desktop npm --prefix admin exec -- vite build --outDir ../../TJXY_app/apps/desktop/dist
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-frontend
          path: TJXY_app/apps/desktop/dist
          if-no-files-found: error
          retention-days: 1

  package:
    name: Package ${{ matrix.name }}
    needs: [validate, frontend]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            builder_args: --win nsis msi --x64
            expected: windows
          - name: Windows ARM64
            # GitHub-hosted ARM64 Windows runners are not generally available
            # for public workflows; build the ARM64 target on x86_64 instead.
            runner: windows-latest
            target: aarch64-pc-windows-msvc
            builder_args: --win nsis msi --arm64
            expected: windows
          - name: macOS Apple Silicon
            runner: macos-latest
            target: aarch64-apple-darwin
            builder_args: --mac dmg --arm64
            expected: dmg
          - name: Linux x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            builder_args: --linux AppImage deb --x64
            expected: linux
          - name: Linux ARM64
            # Native ARM64 runner: cross-linking libmpv on x86_64 would need
            # an aarch64 sysroot that apt multiarch does not provide.
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            builder_args: --linux AppImage deb --arm64
            expected: linux
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          path: TJXY_app
      - uses: actions/checkout@v6
        with:
          repository: youtonghy/TJXY
          ref: main
          path: TJXY
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: TJXY_app/pnpm-lock.yaml
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv-dev fuse libfuse2 patchelf xdg-utils
      - name: Enable MSVC tools
        # dumpbin/lib generate the mpv.lib import library for stage-runtime.
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}
      - name: Install workspace dependencies
        working-directory: TJXY_app
        run: pnpm install --filter desktop --frozen-lockfile
      - uses: actions/download-artifact@v5
        with:
          name: desktop-frontend
          path: TJXY_app/apps/desktop/dist
      - name: Build installer
        working-directory: TJXY_app/apps/desktop
        env:
          TJXY_SKIP_FRONTEND: '1'
          TJXY_PLAYER_TARGET: ${{ matrix.target }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/build.mjs ${{ matrix.builder_args }} -c.extraMetadata.version="$RELEASE_VERSION" --publish never
      - name: Verify expected bundles
        working-directory: TJXY_app
        shell: bash
        run: |
          bundle_dir="apps/desktop/release"
          test -d "$bundle_dir"
          case "${{ matrix.expected }}" in
            windows)
              find "$bundle_dir" -type f -name '*.exe' -print -quit | grep -q .
              find "$bundle_dir" -type f -name '*.msi' -print -quit | grep -q .
              ;;
            dmg) find "$bundle_dir" -type f -name '*.dmg' -print -quit | grep -q . ;;
            linux)
              find "$bundle_dir" -type f -name '*.AppImage' -print -quit | grep -q .
              find "$bundle_dir" -type f -name '*.deb' -print -quit | grep -q .
              ;;
          esac
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ needs.validate.outputs.tag }}
          name: TJXY v${{ needs.validate.outputs.version }}
          body: Desktop bundles for TJXY v${{ needs.validate.outputs.version }}.
          files: TJXY_app/apps/desktop/release/*
